spring:
  datasource:
    url: jdbc:h2:mem:deep_reader_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

app:
  ai:
    llm:
      provider: mock
    translator:
      provider: mock
    max-context-tokens: 1000
    prompt-version: "v1.0"
    openai:
      base-url: https://api.openai.com/v1
      api-key: mock-key
      model: gpt-4o-mini
      timeout-seconds: 12
    deepl:
      api-key: mock-key:fx
      timeout-seconds: 3
  cache:
    explain-ttl-days: 30
    translate-ttl-days: 90
    l1-max-size: 10000
    l1-ttl-hours: 1

server:
  port: 8080
