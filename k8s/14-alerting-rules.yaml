apiVersion: v1
kind: ConfigMap
metadata:
  name: alerting-rules
  namespace: deep-reader
  labels:
    app.kubernetes.io/name: alerting-rules
    app.kubernetes.io/part-of: deep-reader-system
data:
  alerting-rules.yaml: |
    groups:
      - name: deep-reader-business-alerts
        interval: 5s
        rules:
          - alert: DeepReaderHigh5xxErrorRate
            expr: (sum(rate(http_server_requests_seconds_count{status=~"5..", uri=~"/api/.*"}[1m])) / sum(rate(http_server_requests_seconds_count{uri=~"/api/.*"}[1m]))) * 100 > 1
            for: 10s
            labels:
              severity: critical
              tier: business
              service: deep-reader-app
            annotations:
              summary: "Высокая доля ошибок 5xx на API Deep Reader (> 1%)"
              description: "Доля HTTP 5xx ответов составляет {{ $value | printf \"%.2f\" }}% при пороге 1%. Пользователи получают ошибки при вызовах AI-прокси."

          - alert: AiLlmHighLatency
            expr: histogram_quantile(0.95, sum(rate(ai_llm_duration_seconds_bucket[2m])) by (le)) > 8
            for: 2m
            labels:
              severity: warning
              tier: business
              service: deep-reader-app
            annotations:
              summary: "Высокая задержка вызова LLM (> 8s)"
              description: "p95 задержка вызова внешнего LLM API превысила 8 секунд в течение 2 минут (текущее: {{ $value | printf \"%.3f\" }}s)."

          - alert: AiHighEmptyResponseRate
            expr: (sum(rate(ai_errors_total{error_code="EMPTY_AI_RESPONSE"}[5m])) / sum(rate(ai_requests_total{endpoint="explain"}[5m]))) * 100 > 2
            for: 1m
            labels:
              severity: critical
              tier: business
              service: deep-reader-app
            annotations:
              summary: "Высокая доля пустых ответов AI (> 2%)"
              description: "Доля ошибок EMPTY_AI_RESPONSE превысила 2% от общего числа запросов explain за 5 минут."

          - alert: AiExternalProvider5xx
            expr: (sum(rate(ai_provider_latency_seconds_count{status="error"}[1m])) / sum(rate(ai_provider_latency_seconds_count[1m]))) * 100 > 5
            for: 1m
            labels:
              severity: critical
              tier: business
              service: deep-reader-app
            annotations:
              summary: "Высокая доля сбоев внешних провайдеров (> 5%)"
              description: "Доля ошибок внешних провайдеров (OpenAI / DeepL) превысила 5% за 1 минуту."

          - alert: DeepReaderHighApiLatency
            expr: (sum(rate(http_server_requests_seconds_sum{uri=~"/api/.*"}[1m])) / sum(rate(http_server_requests_seconds_count{uri=~"/api/.*"}[1m]))) > 0.5
            for: 10s
            labels:
              severity: warning
              tier: business
              service: deep-reader-app
            annotations:
              summary: "Высокая задержка HTTP-запросов к API Deep Reader (> 500ms)"
              description: "Среднее время обработки API-запросов составляет {{ $value | printf \"%.3f\" }}s (порог 0.5s). Наблюдается деградация отзывчивости сервиса."

      - name: deep-reader-runtime-alerts
        interval: 5s
        rules:
          - alert: JvmMemoryHeapHigh
            expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"} > 0)) * 100 > 80
            for: 10s
            labels:
              severity: critical
              tier: runtime
              service: deep-reader-app
            annotations:
              summary: "Критическое заполнение JVM Heap (> 80%)"
              description: "Использование кучи JVM превысило 80% (текущее: {{ $value | printf \"%.2f\" }}%). Риск OutOfMemoryError."

          - alert: JvmMemoryHeapWarning
            expr: (sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"} > 0)) * 100 > 25
            for: 10s
            labels:
              severity: warning
              tier: runtime
              service: deep-reader-app
            annotations:
              summary: "Повышенное использование памяти JVM Heap (> 25%)"
              description: "Использование кучи JVM превышает 25% (текущее: {{ $value | printf \"%.2f\" }}%)."

          - alert: HikariCPConnectionPoolExhaustion
            expr: (hikaricp_connections_active{pool="HikariPool-1"} / hikaricp_connections_max{pool="HikariPool-1"}) * 100 > 80
            for: 10s
            labels:
              severity: critical
              tier: runtime
              service: deep-reader-app
            annotations:
              summary: "Исчерпание пула коннектов HikariCP к PostgreSQL (> 80%)"
              description: "Пул соединений с БД исчерпан на {{ $value | printf \"%.2f\" }}%. Потоки сервиса блокируются в ожидании соединения."
