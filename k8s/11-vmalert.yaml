apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: deep-reader-system
data:
  rules.yaml: |
    groups:
      - name: deep-reader-alerts
        type: vlogs
        interval: 10s
        rules:
          - alert: ErrorLogsTriggered
            expr: '_time:24h AND level:ERROR | stats by (service) count() errors | filter errors:>0'
            for: 0s
            labels:
              severity: critical
            annotations:
              summary: "В сервисе {{ $labels.service }} обнаружены ошибки level:ERROR"
              description: "Зафиксировано ошибок: {{ $value }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: deep-reader-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules.yaml
            - -datasource.url=http://victoria-logs.deep-reader.svc.cluster.local:9428
            - -httpListenAddr=:8880
            - -evaluationInterval=10s
            - -rule.evalDelay=0s
            - -notifier.blackhole
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: deep-reader-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8880
      targetPort: 8880
  selector:
    app: vmalert
