apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: deep-reader
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: deep-reader-system
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      group_by: ['alertname', 'severity', 'tier']
      group_wait: 5s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'webhook-logger'

    receivers:
      - name: 'webhook-logger'
        webhook_configs:
          - url: 'http://127.0.0.1:9099/webhook'
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: deep-reader
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: deep-reader-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: webhook-logger
          image: python:3.11-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -u
            - -c
            - |
              from http.server import HTTPServer, BaseHTTPRequestHandler
              import json, sys

              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get('content-length', 0))
                      body = self.rfile.read(length)
                      try:
                          data = json.loads(body.decode('utf-8'))
                          status = data.get('status', 'unknown').upper()
                          for a in data.get('alerts', []):
                              labels = a.get('labels', {})
                              annotations = a.get('annotations', {})
                              print(f"[ALERT NOTIFICATION] status={status} alert={labels.get('alertname')} severity={labels.get('severity')} summary='{annotations.get('summary')}'", flush=True)
                      except Exception as e:
                          print("Parse error:", e, flush=True)
                      self.send_response(200)
                      self.end_headers()
                      self.wfile.write(b"OK")
                  def log_message(self, format, *args):
                      return

              print("Webhook logger started on :9099", flush=True)
              HTTPServer(('0.0.0.0', 9099), H).serve_forever()
          ports:
            - name: webhook
              containerPort: 9099
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: deep-reader
  labels:
    app: alertmanager
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: deep-reader-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9093
      targetPort: 9093
  selector:
    app: alertmanager
