apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-reader-prober
  namespace: deep-reader
  labels:
    app: deep-reader-prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deep-reader-prober
  template:
    metadata:
      labels:
        app: deep-reader-prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: python:3.11-alpine
          command:
            - python
            - /scripts/prober.py
            - --target
            - http://deep-reader-app:8080
            - --metrics-port
            - "9090"
            - --interval
            - "1.0"
          ports:
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: prober-script-volume
              mountPath: /scripts
      volumes:
        - name: prober-script-volume
          configMap:
            name: deep-reader-prober-script
---
apiVersion: v1
kind: Service
metadata:
  name: deep-reader-prober
  namespace: deep-reader
  labels:
    app: deep-reader-prober
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: deep-reader-prober
