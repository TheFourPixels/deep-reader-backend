spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: deep-reader-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deep_reader}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
  shutdown: graceful

app:
  ai:
    llm:
      provider: ${AI_LLM_PROVIDER:openai}
    translator:
      provider: ${AI_TRANSLATOR_PROVIDER:deepl}
    max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:1000}
    prompt-version: "v1.0"
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:mock-key}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:12}
    deepl:
      api-key: ${DEEPL_API_KEY:mock-key:fx}
      timeout-seconds: ${DEEPL_TIMEOUT_SECONDS:3}
  cache:
    explain-ttl-days: ${EXPLAIN_CACHE_TTL_DAYS:30}
    translate-ttl-days: ${TRANSLATE_CACHE_TTL_DAYS:90}
    l1-max-size: ${CACHE_L1_MAX_SIZE:10000}
    l1-ttl-hours: ${CACHE_L1_TTL_HOURS:1}

resilience4j:
  circuitbreaker:
    instances:
      openai:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      deepl:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      openai:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        exponential-max-wait-duration: 2s
      deepl:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        exponential-max-wait-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
      base-path: /actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ai.llm.duration.seconds: true
        ai.provider.latency.seconds: true
        ai.translation.duration.seconds: true
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1s
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.teamfourpixels.deepreaderbackend: ${LOG_LEVEL:INFO}
