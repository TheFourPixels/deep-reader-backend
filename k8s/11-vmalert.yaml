apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: deep-reader-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/*.yaml
            - -datasource.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -remoteRead.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -remoteWrite.url=http://vm-single-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
            - -notifier.url=http://alertmanager.deep-reader.svc.cluster.local:9093
            - -httpListenAddr=:8880
            - -evaluationInterval=5s
            - -rule.evalDelay=0s
          ports:
            - name: http
              containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: rules
          configMap:
            name: alerting-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app: vmalert
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: deep-reader-system
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8880
      targetPort: 8880
  selector:
    app: vmalert
