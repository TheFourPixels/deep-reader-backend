apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-reader-app
  labels:
    app: deep-reader-app
    app.kubernetes.io/name: deep-reader-app
    app.kubernetes.io/part-of: deep-reader-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: deep-reader-app
  template:
    metadata:
      labels:
        app: deep-reader-app
    spec:
      containers:
        - name: deep-reader-app
          image: deep-reader-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: deep-reader-config
            - secretRef:
                name: deep-reader-secret
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
