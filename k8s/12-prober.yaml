apiVersion: v1
kind: ConfigMap
metadata:
  name: deep-reader-prober-script
  namespace: deep-reader
data:
  prober.py: |
    import argparse
    import http.server
    import json
    import logging
    import math
    import random
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s [%(levelname)s] %(message)s",
        datefmt="%H:%M:%S"
    )
    log = logging.getLogger("prober")

    lock = threading.Lock()
    metrics_data = {
        "probes_total": {},
        "probes_success": {},
        "probes_failed": {},
        "last_duration_seconds": {},
        "recent_results": [],
        "recent_latencies": [],
        "total_probes": 0,
        "total_success": 0,
        "total_failed": 0,
        "is_healthy": 1
    }

    MAX_RECENT_SAMPLES = 120

    def record_probe(endpoint, method, success, duration, status_code):
        with lock:
            key = (endpoint, method)
            metrics_data["probes_total"][key] = metrics_data["probes_total"].get(key, 0) + 1
            if success:
                metrics_data["probes_success"][key] = metrics_data["probes_success"].get(key, 0) + 1
                metrics_data["total_success"] += 1
            else:
                metrics_data["probes_failed"][key] = metrics_data["probes_failed"].get(key, 0) + 1
                metrics_data["total_failed"] += 1

            metrics_data["total_probes"] += 1
            metrics_data["last_duration_seconds"][key] = duration
            metrics_data["is_healthy"] = 1 if success else 0

            metrics_data["recent_results"].append(1 if success else 0)
            metrics_data["recent_latencies"].append(duration)
            if len(metrics_data["recent_results"]) > MAX_RECENT_SAMPLES:
                metrics_data["recent_results"].pop(0)
                metrics_data["recent_latencies"].pop(0)

    def calculate_sli():
        with lock:
            recent = metrics_data["recent_results"]
            latencies = metrics_data["recent_latencies"]
            if not recent:
                return 100.0, 100.0, 0.0

            avail_sli = (sum(recent) / len(recent)) * 100.0
            good_latency = sum(1 for d in latencies if d <= 0.200)
            latency_sli = (good_latency / len(latencies)) * 100.0

            sorted_lat = sorted(latencies)
            idx_p95 = int(math.ceil(0.95 * len(sorted_lat))) - 1
            p95 = sorted_lat[max(0, min(idx_p95, len(sorted_lat) - 1))] * 1000.0

            return avail_sli, latency_sli, p95

    class MetricsHttpHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics" or self.path == "/":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                self.end_headers()

                avail_sli, latency_sli, p95_ms = calculate_sli()

                lines = [
                    "# HELP prober_up Availability of the target service from prober perspective",
                    "# TYPE prober_up gauge",
                    f"prober_up {metrics_data['is_healthy']}",
                    "",
                    "# HELP prober_availability_ratio Rolling availability SLI in percent",
                    "# TYPE prober_availability_ratio gauge",
                    f"prober_availability_ratio {avail_sli:.2f}",
                    "",
                    "# HELP prober_latency_compliance_ratio Rolling percentage of requests faster than 200ms",
                    "# TYPE prober_latency_compliance_ratio gauge",
                    f"prober_latency_compliance_ratio {latency_sli:.2f}",
                    "",
                    "# HELP prober_latency_p95_ms 95th percentile latency in milliseconds",
                    "# TYPE prober_latency_p95_ms gauge",
                    f"prober_latency_p95_ms {p95_ms:.2f}",
                    "",
                    "# HELP prober_requests_total Total synthetic probes sent by prober",
                    "# TYPE prober_requests_total counter"
                ]

                with lock:
                    for (ep, method), count in metrics_data["probes_total"].items():
                        lines.append(f'prober_requests_total{{endpoint="{ep}",method="{method}"}} {count}')

                    lines.append("")
                    lines.append("# HELP prober_requests_success_total Successful synthetic probes (HTTP < 500)")
                    lines.append("# TYPE prober_requests_success_total counter")
                    for (ep, method), count in metrics_data["probes_success"].items():
                        lines.append(f'prober_requests_success_total{{endpoint="{ep}",method="{method}"}} {count}')

                    lines.append("")
                    lines.append("# HELP prober_requests_failed_total Failed synthetic probes (HTTP 5xx or connection error)")
                    lines.append("# TYPE prober_requests_failed_total counter")
                    for (ep, method), count in metrics_data["probes_failed"].items():
                        lines.append(f'prober_requests_failed_total{{endpoint="{ep}",method="{method}"}} {count}')

                    lines.append("")
                    lines.append("# HELP prober_last_duration_seconds Latency of the last probe in seconds")
                    lines.append("# TYPE prober_last_duration_seconds gauge")
                    for (ep, method), duration in metrics_data["last_duration_seconds"].items():
                        lines.append(f'prober_last_duration_seconds{{endpoint="{ep}",method="{method}"}} {duration:.6f}')

                lines.append("")
                self.wfile.write("\n".join(lines).encode("utf-8"))
            elif self.path == "/health":
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"status":"UP","service":"deep-reader-prober"}')
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            return

    def start_metrics_server(port):
        server = http.server.ThreadingHTTPServer(("0.0.0.0", port), MetricsHttpHandler)
        thread = threading.Thread(target=server.serve_forever, daemon=True)
        thread.start()
        log.info(f"Prometheus metrics exporter started on port {port} (/metrics)")

    def probe_endpoint(base_url, endpoint, method="GET", payload=None, timeout=5.0):
        url = f"{base_url.rstrip('/')}{endpoint}"
        data = None
        headers = {"User-Agent": "DeepReaderProber/1.0"}

        if payload is not None:
            data = json.dumps(payload).encode("utf-8")
            headers["Content-Type"] = "application/json"

        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        start_time = time.perf_counter()

        try:
            with urllib.request.urlopen(req, timeout=timeout) as resp:
                status_code = resp.status
                resp.read()
                duration = time.perf_counter() - start_time
                success = status_code < 500
                record_probe(endpoint, method, success, duration, status_code)
                return status_code, duration, success, None
        except urllib.error.HTTPError as e:
            duration = time.perf_counter() - start_time
            success = e.code < 500
            record_probe(endpoint, method, success, duration, e.code)
            return e.code, duration, success, str(e.reason)
        except Exception as e:
            duration = time.perf_counter() - start_time
            record_probe(endpoint, method, False, duration, 0)
            return 0, duration, False, str(e)

    def run_prober_loop(base_url, interval, duration_limit=0):
        log.info(f"Starting prober against target: {base_url} (interval={interval}s)")

        scenarios = [
            {"endpoint": "/api/health", "method": "GET", "weight": 2},
            {"endpoint": "/api/books", "method": "GET", "weight": 4},
            {"endpoint": "/api/books/1", "method": "GET", "weight": 3},
            {"endpoint": "/api/books/1/chapters/1", "method": "GET", "weight": 3},
            {"endpoint": "/api/stats", "method": "GET", "weight": 2},
            {
                "endpoint": "/api/books/1/annotations",
                "method": "POST",
                "weight": 1,
                "payload_gen": lambda: {
                    "selectedText": "Цитата из главы " + str(random.randint(100, 999)),
                    "note": "Chapter 1 review note",
                    "type": "LITERARY_ALLUSION",
                    "startOffset": 10,
                    "endOffset": 50,
                    "chapterId": 1
                }
            }
        ]

        weighted_pool = []
        for s in scenarios:
            for _ in range(s["weight"]):
                weighted_pool.append(s)

        start_time = time.time()

        while True:
            if duration_limit > 0 and (time.time() - start_time) >= duration_limit:
                log.info("Prober duration limit reached. Exiting loop.")
                break

            scenario = random.choice(weighted_pool)
            ep = scenario["endpoint"]
            method = scenario["method"]
            payload = scenario["payload_gen"]() if "payload_gen" in scenario else None

            status_code, dur, success, err = probe_endpoint(base_url, ep, method, payload)
            avail_sli, latency_sli, p95_ms = calculate_sli()

            status_flag = "OK" if success else "FAIL"
            log.info(
                f"[{status_flag}] {method} {ep} -> {status_code} ({dur*1000:.1f}ms) | "
                f"avail={avail_sli:.1f}% lat={latency_sli:.1f}% p95={p95_ms:.1f}ms"
            )

            time.sleep(interval)

    def main():
        parser = argparse.ArgumentParser(description="Deep Reader Synthetic Prober")
        parser.add_argument("--target", default="http://localhost:8080", help="Base URL of Deep Reader backend")
        parser.add_argument("--interval", type=float, default=1.0, help="Interval between probes in seconds (default: 1.0)")
        parser.add_argument("--metrics-port", type=int, default=9090, help="Port to expose Prometheus metrics (default: 9090)")
        parser.add_argument("--duration", type=int, default=0, help="Run duration in seconds (0 = infinite)")
        args = parser.parse_args()

        start_metrics_server(args.metrics_port)
        try:
            run_prober_loop(args.target, args.interval, args.duration)
        except KeyboardInterrupt:
            log.info("Prober stopped.")

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-reader-prober
  namespace: deep-reader
  labels:
    app: deep-reader-prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deep-reader-prober
  template:
    metadata:
      labels:
        app: deep-reader-prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: python:3.11-alpine
          command:
            - python
            - /scripts/prober.py
            - --target
            - http://deep-reader-app:8080
            - --metrics-port
            - "9090"
            - --interval
            - "1.0"
          ports:
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: prober-script-volume
              mountPath: /scripts
      volumes:
        - name: prober-script-volume
          configMap:
            name: deep-reader-prober-script
---
apiVersion: v1
kind: Service
metadata:
  name: deep-reader-prober
  namespace: deep-reader
  labels:
    app: deep-reader-prober
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: deep-reader-prober
