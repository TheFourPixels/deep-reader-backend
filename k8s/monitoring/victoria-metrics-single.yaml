apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vm-single-victoria-metrics-single-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vm-single-victoria-metrics-single-server
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vm-single-victoria-metrics-single-server
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vm-single-victoria-metrics-single-server
subjects:
  - kind: ServiceAccount
    name: vm-single-victoria-metrics-single-server
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-single-scrapeconfig
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: "victoriametrics"
        static_configs:
          - targets: ["localhost:8428"]

      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: container

      - job_name: "kubernetes-services"
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-single-storage
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vm-single-victoria-metrics-single-server
  namespace: monitoring
  labels:
    app: victoria-metrics-single
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoria-metrics-single
      app.kubernetes.io/name: victoria-metrics-single
      app.kubernetes.io/instance: vm-single
  template:
    metadata:
      labels:
        app: victoria-metrics-single
        app.kubernetes.io/name: victoria-metrics-single
        app.kubernetes.io/instance: vm-single
    spec:
      serviceAccountName: vm-single-victoria-metrics-single-server
      containers:
        - name: victoria-metrics
          image: victoriametrics/victoria-metrics:v1.107.0
          imagePullPolicy: IfNotPresent
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=14d
            - -promscrape.config=/etc/scrapeconfig/scrape.yml
            - -httpListenAddr=:8428
          ports:
            - name: http
              containerPort: 8428
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: scrapeconfig
              mountPath: /etc/scrapeconfig
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: vm-single-storage
        - name: scrapeconfig
          configMap:
            name: vm-single-scrapeconfig
---
apiVersion: v1
kind: Service
metadata:
  name: vm-single-victoria-metrics-single-server
  namespace: monitoring
  labels:
    app: victoria-metrics-single
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8428
      targetPort: 8428
  selector:
    app: victoria-metrics-single
    app.kubernetes.io/name: victoria-metrics-single
    app.kubernetes.io/instance: vm-single
